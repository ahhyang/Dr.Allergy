name: dr_allergy
description: AI-powered allergy food checker app using Gemini API for allergen detection
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  image_picker: ^0.8.9
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  intl: ^0.18.1
  path_provider: ^2.1.1
  provider: ^6.0.5
  csv: ^5.0.2
  permission_handler: ^10.4.5
  logging: ^1.3.0
  
  # Image processing dependencies
  opencv_dart: ^1.4.1 # OpenCV for Flutter
  google_mlkit_text_recognition: ^0.15.0 # ML Kit for text recognition
  google_mlkit_image_labeling: ^0.14.1 # ML Kit for image labeling
  tflite_flutter: ^0.11.0 # TensorFlow Lite for Flutter
  image: ^4.5.4 # Image processing library
  flutter_tesseract_ocr: ^0.4.23 # Optional: Tesseract OCR alternative
  flutter_image_compress: ^2.4.0 # Image compression
  image_pixels: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/icons/
    - assets/allergydataset/
    - allergydataset/
    - assets/models/ # For TFLite models
